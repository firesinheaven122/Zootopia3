services:

  db:
    image: postgres:15-alpine
    env_file: ".env"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    expose:
      - "5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ichkeevas -d pet_shop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ichkeevas:sonya2006@db/pet_shop_db
      ADMIN_EMAIL: nastya_danilova2006@mail.ru
      ADMIN_PASSWORD: AdmInSALD
      ADMIN_NAME: Анастасия Данилова
    volumes:
      - ./Backend/static:/app/static
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: